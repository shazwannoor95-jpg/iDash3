name: iDash3 Android CI

# Debug/QA only. No keystore or secret is used; the APK is signed with the generic debug key and is
# not a release. Emulator results are x86_64 and do not certify ARM32 head-unit performance.
on:
  push:
    branches: ['claude/**', 'ci/**', 'main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: idash3-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests, lint & guard
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Static guard
        run: bash tools/ci/guard.sh
      - name: assembleDebug + assembleDebugAndroidTest
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest :debloat:assembleDebug 2>&1 | tee build.log
      - name: Unit tests (testDebugUnitTest)
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest --console=plain 2>&1 | tee unit-test.log
          n=$(cat app/build/test-results/testDebugUnitTest/*.xml | grep -o 'tests="[0-9]*"' | grep -o '[0-9]*' | paste -sd+ | bc)
          f=$(cat app/build/test-results/testDebugUnitTest/*.xml | grep -o 'failures="[0-9]*"' | grep -o '[0-9]*' | paste -sd+ | bc)
          echo "### Unit tests: $n run, $f failures" >> "$GITHUB_STEP_SUMMARY"
          [ "${n:-0}" -gt 0 ] || { echo "no unit tests ran"; exit 1; }
      - name: lintDebug
        run: ./gradlew --no-daemon :app:lintDebug :debloat:lintDebug 2>&1 | tee lint.log
      - name: APK guard
        run: bash tools/ci/guard.sh app/build/outputs/apk/debug/app-debug.apk
      - name: Lint summary
        if: always()
        run: |
          f=app/build/reports/lint-results-debug.xml
          if [ -f "$f" ]; then echo "### lintDebug: $(grep -c 'severity="Error"' "$f" || true) errors, $(grep -c 'severity="Warning"' "$f" || true) warnings" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Checksum APK
        run: |
          mkdir -p qa-apk
          cp app/build/outputs/apk/debug/app-debug.apk qa-apk/iDash3-debug-QA.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk qa-apk/iDash3-androidTest-QA.apk
          cp debloat/build/outputs/apk/debug/debloat-debug.apk qa-apk/iDash3-Debloat-QA.apk
          (cd qa-apk && sha256sum *.apk | tee SHA256SUMS.txt)
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat qa-apk/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Generic debug APK for QA only; not a release." > qa-apk/NOTE.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-apk-debug
          path: qa-apk/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
            build.log
            unit-test.log
            lint.log
          retention-days: 14

  emulator:
    name: Emulator API27 (1 GB RAM) — device QA + instrumentation
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: qa-apk-debug
          path: qa-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator API27 x86_64
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 27
          target: default
          arch: x86_64
          profile: Nexus 7
          ram-size: 1024M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            bash tools/ci/device-qa.sh qa-apk/iDash3-debug-QA.apk qa-device || echo "DEVICE_QA_FAILED" > qa-device/FAILED
            bash tools/ci/run-instrumentation.sh qa-apk/iDash3-debug-QA.apk qa-apk/iDash3-androidTest-QA.apk qa-out || echo "INSTRUMENTATION_FAILED" > qa-out/FAILED
      - name: Summary
        if: always()
        run: |
          [ -f qa-device/summary.md ] && cat qa-device/summary.md >> "$GITHUB_STEP_SUMMARY" || echo "### Device QA: NOT RUN" >> "$GITHUB_STEP_SUMMARY"
          [ -f qa-out/summary.md ] && cat qa-out/summary.md >> "$GITHUB_STEP_SUMMARY" || echo "### Instrumentation: NOT RUN" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-qa
          path: |
            qa-device/
            qa-out/
          retention-days: 14
      - name: Fail if any gate failed
        if: always()
        run: |
          [ -f qa-device/summary.md ] && [ -f qa-out/summary.md ] || { echo "emulator steps did not complete"; exit 1; }
          [ ! -f qa-device/FAILED ] && [ ! -f qa-out/FAILED ]
