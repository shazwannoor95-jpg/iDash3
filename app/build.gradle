plugins { id 'com.android.application' }
android {
    namespace 'com.shazwan.idash3'
    compileSdk 35
    defaultConfig {
        applicationId 'com.shazwan.idash3'
        minSdk 26
        targetSdk 35
        versionCode 13
        versionName '0.5.0-rc1'
        testInstrumentationRunner providers.gradleProperty('idashRunner').getOrElse('com.shazwan.idash3.SmokeChecks')
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    buildTypes { release { minifyEnabled false } }
    testOptions { unitTests.returnDefaultValues = true }
    lint { abortOnError true; warningsAsErrors false }
}
dependencies { implementation 'org.osmdroid:osmdroid-android:6.1.20'; testImplementation 'junit:junit:4.13.2' }
